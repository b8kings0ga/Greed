version: '3'

vars:
  PACKAGE: '{{default "com.excp.podroid.debug" .PACKAGE}}'
  ACTIVITY: '{{default "com.excp.podroid.MainActivity" .ACTIVITY}}'
  APK: '{{default "" .APK}}'
  ADB: '{{default "adb" .ADB}}'
  MIMIR_DIR: '{{default "../Mimir" .MIMIR_DIR}}'
  DIST_APK: '{{default "dist/podroid-debug.apk" .DIST_APK}}'
  RATATOSKR_STAMP: '{{default ".ratatoskr-native-source.sha" .RATATOSKR_STAMP}}'
  YOLO_VENV: '{{default ".venv-yolo" .YOLO_VENV}}'
  YOLO_SOURCE: '{{default "http://192.168.1.33:18080/stream.mjpg" .YOLO_SOURCE}}'
  YOLO_PORT: '{{default "18888" .YOLO_PORT}}'
  YOLO_FPS: '{{default "3" .YOLO_FPS}}'
  YOLO_CONF: '{{default "0.25" .YOLO_CONF}}'
  YOLO_WORLD_CONF: '{{default "0.01" .YOLO_WORLD_CONF}}'
  YOLO_CLASSES: '{{default "person,face,hand,phone,laptop,keyboard,mouse,monitor,bottle,cup,book,backpack,chair,table,door,window" .YOLO_CLASSES}}'
  STT_SOURCE: '{{default "http://192.168.1.33:18082/stream.wav" .STT_SOURCE}}'
  STT_MODEL: '{{default "tiny" .STT_MODEL}}'
  STT_LANGUAGE: '{{default "auto" .STT_LANGUAGE}}'
  STT_MIN_RMS: '{{default "0.025" .STT_MIN_RMS}}'
  STT_CHUNK_SECONDS: '{{default "2.5" .STT_CHUNK_SECONDS}}'
  STT_TRANSLATE: '{{default "true" .STT_TRANSLATE}}'
  FLOW_PORT: '{{default "18889" .FLOW_PORT}}'
  FLOW_STT_BACKEND: '{{default "faster-whisper" .FLOW_STT_BACKEND}}'
  FLOW_CHUNK_SECONDS: '{{default "1.0" .FLOW_CHUNK_SECONDS}}'
  FLOW_MIN_RMS: '{{default "0.005" .FLOW_MIN_RMS}}'
  FLOW_LLM_URL: '{{default "https://gjallarhorn.gjallarhorngit.orb.local/v1/chat/completions" .FLOW_LLM_URL}}'
  FLOW_LLM_BACKEND: '{{default "openai" .FLOW_LLM_BACKEND}}'
  FLOW_LLM_MODEL: '{{default "data" .FLOW_LLM_MODEL}}'
  FLOW_LLM_KEY: '{{default "fake-key" .FLOW_LLM_KEY}}'
  FLOW_LLM_INSECURE: '{{default "true" .FLOW_LLM_INSECURE}}'
  CF_ACCOUNT_ID: '{{default "493511f38053d97a5c71d021374bb67a" .CF_ACCOUNT_ID}}'
  CF_AUTH_EMAIL: '{{default "Tiancailishen111@gmail.com" .CF_AUTH_EMAIL}}'
  CF_WHISPER_MODEL: '{{default "@cf/openai/whisper" .CF_WHISPER_MODEL}}'
  CF_GLM_MODEL: '{{default "@cf/zai-org/glm-4.7-flash" .CF_GLM_MODEL}}'

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  devices:
    desc: Show adb devices that are ready for sideloading.
    cmds:
      - |
        set -eu
        {{.ADB}} devices

  yolo:install:
    desc: Create a local Python venv for YOLO stream detection.
    cmds:
      - |
        set -eu
        python3 -m venv "{{.YOLO_VENV}}"
        "{{.YOLO_VENV}}/bin/python" -m pip install --upgrade pip
        "{{.YOLO_VENV}}/bin/python" -m pip install ultralytics opencv-python flask pillow faster-whisper mlx-whisper numpy \
          "git+https://github.com/ultralytics/CLIP.git"

  yolo:stream:
    desc: Run local YOLO detection on the Podroid camera stream.
    cmds:
      - |
        set -eu
        test -x "{{.YOLO_VENV}}/bin/python" || task yolo:install
        "{{.YOLO_VENV}}/bin/python" tools/yolo_stream_viewer.py \
          --source "{{.YOLO_SOURCE}}" \
          --port "{{.YOLO_PORT}}" \
          --fps "{{.YOLO_FPS}}" \
          --conf "{{.YOLO_CONF}}"

  yolo:world:
    desc: Run YOLO-World on the Podroid camera stream with a prefilled class list.
    cmds:
      - |
        set -eu
        test -x "{{.YOLO_VENV}}/bin/python" || task yolo:install
        "{{.YOLO_VENV}}/bin/python" tools/yolo_stream_viewer.py \
          --source "{{.YOLO_SOURCE}}" \
          --port "{{.YOLO_PORT}}" \
          --fps "{{.YOLO_FPS}}" \
          --conf "{{.YOLO_WORLD_CONF}}" \
          --world \
          --model yolov8s-worldv2.pt \
          --classes "{{.YOLO_CLASSES}}"

  sense:listen:
    desc: Run the local vision page and transcribe the Podroid microphone stream.
    cmds:
      - |
        set -eu
        test -x "{{.YOLO_VENV}}/bin/python" || task yolo:install
        "{{.YOLO_VENV}}/bin/python" tools/yolo_stream_viewer.py \
          --source "{{.YOLO_SOURCE}}" \
          --port "{{.YOLO_PORT}}" \
          --fps "{{.YOLO_FPS}}" \
          --conf "{{.YOLO_CONF}}" \
          --stt \
          --audio-source "{{.STT_SOURCE}}" \
          --stt-model "{{.STT_MODEL}}" \
          --stt-language "{{.STT_LANGUAGE}}" \
          --stt-chunk-seconds "{{.STT_CHUNK_SECONDS}}" \
          --stt-min-rms "{{.STT_MIN_RMS}}" \
          {{if eq .STT_TRANSLATE "false"}}--no-stt-translate{{else}}--stt-translate{{end}}

  sense:flow:
    desc: Run a local Wispr Flow style dictation cleanup page.
    cmds:
      - |
        set -eu
        test -x "{{.YOLO_VENV}}/bin/python" || task yolo:install
        "{{.YOLO_VENV}}/bin/python" tools/flow.py \
          --audio-source "{{.STT_SOURCE}}" \
          --port "{{.FLOW_PORT}}" \
          --stt-backend "{{.FLOW_STT_BACKEND}}" \
          --stt-model "{{.STT_MODEL}}" \
          --language "{{.STT_LANGUAGE}}" \
          --chunk-seconds "{{.FLOW_CHUNK_SECONDS}}" \
          --min-rms "{{.FLOW_MIN_RMS}}" \
          --llm-url "{{.FLOW_LLM_URL}}" \
          --llm-backend "{{.FLOW_LLM_BACKEND}}" \
          --llm-model "{{.FLOW_LLM_MODEL}}" \
          --llm-key "{{.FLOW_LLM_KEY}}" \
          --cf-account-id "{{.CF_ACCOUNT_ID}}" \
          --cf-auth-email "{{.CF_AUTH_EMAIL}}" \
          --cf-whisper-model "{{.CF_WHISPER_MODEL}}" \
          --cf-glm-model "{{.CF_GLM_MODEL}}" \
          {{if eq .FLOW_LLM_INSECURE "true"}}--llm-insecure{{else}}--no-llm-insecure{{end}}

  sense:flow:cloudflare:
    desc: Run Sense Flow with Cloudflare Whisper and GLM 4.7 Flash.
    cmds:
      - |
        set -eu
        test -n "${CF_GLOBAL_KEY:-}" || {
          echo "CF_GLOBAL_KEY is required" >&2
          exit 1
        }
        FLOW_STT_BACKEND=cloudflare-whisper \
        FLOW_LLM_BACKEND=cloudflare-glm \
        FLOW_LLM_INSECURE=false \
        task sense:flow

  vegvisir:update:
    desc: Refresh join targets from the current Mimir vegvisir document.
    cmds:
      - python3 tools/sync-vegvisir.py

  ratatoskr:status:
    desc: Show whether the embedded Ratatoskr native payload is current with the local Mimir checkout.
    cmds:
      - |
        set -eu
        mimir="{{.MIMIR_DIR}}"
        test -d "$mimir/.git" || {
          echo "Mimir repo not found: $mimir" >&2
          exit 1
        }
        current="$(task _ratatoskr:fingerprint)"
        previous="$(cat "{{.RATATOSKR_STAMP}}" 2>/dev/null || true)"
        image_asset="build-rootfs/files/opt/podroid/assets/ratatoskr-native.tar.zst"
        echo "Mimir:     $mimir"
        echo "Current:   $current"
        echo "Previous:  ${previous:-<none>}"
        if [ "$current" = "$previous" ] && [ -f "$image_asset" ]; then
          echo "Ratatoskr native payload asset is current."
        else
          echo "Ratatoskr native payload asset needs update."
        fi

  ratatoskr:update-apk:
    desc: Rebuild Ratatoskr native payload only when Mimir changed, then rebuild rootfs and APK into dist/.
    cmds:
      - |
        set -eu
        mimir="{{.MIMIR_DIR}}"
        test -d "$mimir/.git" || {
          echo "Mimir repo not found: $mimir" >&2
          exit 1
        }
        current="$(task _ratatoskr:fingerprint)"
        previous="$(cat "{{.RATATOSKR_STAMP}}" 2>/dev/null || true)"
        image_asset="build-rootfs/files/opt/podroid/assets/ratatoskr-native.tar.zst"

        if [ "$current" != "$previous" ] || [ ! -f "$image_asset" ]; then
          echo "Ratatoskr native payload source changed; rebuilding embedded native payload."
          MIMIR_DIR="$mimir" ./build-all.sh ratatoskr-native
          printf '%s\n' "$current" > "{{.RATATOSKR_STAMP}}"
        else
          echo "Ratatoskr native payload source unchanged; keeping existing embedded native payload."
        fi

        echo "Rebuilding rootfs so embedded native payload/config/service changes are packaged."
        ./build-all.sh rootfs

        if [ -d /opt/homebrew/opt/openjdk ]; then
          export JAVA_HOME="${JAVA_HOME:-/opt/homebrew/opt/openjdk}"
          export PATH="$JAVA_HOME/bin:$PATH"
        fi
        ./build-all.sh apk
        mkdir -p "$(dirname "{{.DIST_APK}}")"
        cp app/build/outputs/apk/debug/app-debug.apk "{{.DIST_APK}}"
        echo "APK ready: {{.DIST_APK}}"

  update:
    desc: Alias for ratatoskr:update-apk.
    cmds:
      - task ratatoskr:update-apk

  ratatoskr:force-update-apk:
    desc: Force rebuild Ratatoskr native payload, rootfs, and APK into dist/.
    cmds:
      - |
        set -eu
        rm -f "{{.RATATOSKR_STAMP}}"
        task ratatoskr:update-apk

  sideload:
    desc: Install the already-built Podroid APK onto one adb device, then launch it.
    cmds:
      - |
        set -eu
        apk="{{.APK}}"
        if [ -z "$apk" ]; then
          apk=$(ls -t dist/*podroid*.apk dist/*.apk app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | head -1 || true)
        fi
        test -f "$apk" || {
          echo "APK not found. Build it first, or pass APK=/path/to/podroid.apk" >&2
          exit 1
        }
        serial="${SERIAL:-}"
        if [ -z "$serial" ]; then
          serial="$({{.ADB}} devices | awk 'NR > 1 && $2 == "device" {print $1}')"
          count=$(printf '%s\n' "$serial" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "No adb device in 'device' state. Run: task devices" >&2
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "Multiple adb devices found. Choose one with: SERIAL=<serial> task sideload" >&2
            printf '%s\n' "$serial" >&2
            exit 1
          fi
        fi
        echo "Installing $apk to $serial"
        {{.ADB}} -s "$serial" install -r "$apk"
        echo "Launching {{.PACKAGE}} on $serial"
        {{.ADB}} -s "$serial" shell am force-stop "{{.PACKAGE}}" >/dev/null 2>&1 || true
        {{.ADB}} -s "$serial" shell monkey -p "{{.PACKAGE}}" -c android.intent.category.LAUNCHER 1 >/dev/null
        echo "Done. Fixed vegvisir Nomad RPC targets:"
        python3 -c 'import json; d=json.load(open("build-rootfs/files/etc/ratatoskr/vegvisir.json")); print(json.dumps(d["regions"], indent=2))'

  sideload:no-launch:
    desc: Install the already-built Podroid APK onto one adb device without launching it.
    cmds:
      - |
        set -eu
        apk="{{.APK}}"
        if [ -z "$apk" ]; then
          apk=$(ls -t dist/*podroid*.apk dist/*.apk app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | head -1 || true)
        fi
        test -f "$apk" || {
          echo "APK not found. Build it first, or pass APK=/path/to/podroid.apk" >&2
          exit 1
        }
        serial="${SERIAL:-}"
        if [ -z "$serial" ]; then
          serial="$({{.ADB}} devices | awk 'NR > 1 && $2 == "device" {print $1}')"
          count=$(printf '%s\n' "$serial" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "No adb device in 'device' state. Run: task devices" >&2
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "Multiple adb devices found. Choose one with: SERIAL=<serial> task sideload:no-launch" >&2
            printf '%s\n' "$serial" >&2
            exit 1
          fi
        fi
        echo "Installing $apk to $serial"
        {{.ADB}} -s "$serial" install -r "$apk"

  verify:ratatoskr:
    desc: Check the running VM on one adb device for Ratatoskr and current vegvisir join targets.
    cmds:
      - |
        set -eu
        serial="${SERIAL:-}"
        if [ -z "$serial" ]; then
          serial="$({{.ADB}} devices | awk 'NR > 1 && $2 == "device" {print $1}')"
          count=$(printf '%s\n' "$serial" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "Set SERIAL=<serial> when zero or multiple devices are connected." >&2
            printf '%s\n' "$serial" >&2
            exit 1
          fi
        fi
        echo "Console markers:"
        {{.ADB}} -s "$serial" shell run-as "{{.PACKAGE}}" tail -80 files/console.log || true
        echo
        echo "Expected fixed Nomad RPC targets:"
        python3 -c 'import json; d=json.load(open("build-rootfs/files/etc/ratatoskr/vegvisir.json")); print(json.dumps(d["regions"], indent=2))'
        echo
        echo "Expected fixed NATS targets:"
        sed -n '/^CONF_bark.identity.nats_urls=/p' build-rootfs/files/etc/ratatoskr/env

  _ratatoskr:fingerprint:
    cmds:
      - MIMIR_DIR="{{.MIMIR_DIR}}" python3 tools/runtime-fingerprint.py
